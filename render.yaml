services:
  - type: web
    name: resell-pick
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_MODEL
        value: gpt-4.1-mini

      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /tmp/resell_pick.db
