<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>리셀 PICK 계정·데이터 삭제</title><style>
:root{font-family:Arial,"Noto Sans KR",sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eaf1fb 0,#f7f9fc 320px);min-height:100vh}.wrap{width:min(760px,calc(100% - 28px));margin:0 auto;padding:34px 0 60px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.logo{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:24px;font-weight:1000;color:white;background:linear-gradient(135deg,#1c64f2,#183b8f);box-shadow:0 10px 24px rgba(28,100,242,.25)}h1{font-size:26px;margin:0}.sub{color:#64748b;margin-top:4px}.card{background:#fff;border:1px solid #d9e2ef;border-radius:20px;padding:22px;box-shadow:0 12px 32px rgba(40,61,94,.08)}h2{font-size:18px;margin:24px 0 8px}h2:first-child{margin-top:0}p,li{line-height:1.7;color:#344258}ul{padding-left:22px}.notice{padding:13px 15px;border-radius:14px;background:#eef5ff;color:#244a83;line-height:1.6;margin:14px 0}.danger-note{background:#fff1f1;color:#8d2828}.field{margin-top:14px}.field label{display:block;font-weight:800;margin-bottom:7px}.field input{width:100%;padding:14px;border:1px solid #cbd6e4;border-radius:12px;font-size:16px}.btn{width:100%;border:0;border-radius:13px;padding:15px;font-weight:900;font-size:16px;cursor:pointer}.btn.primary{background:#1f5fd6;color:white}.btn.secondary{background:#e8eef8;color:#243c64}.actions{display:grid;gap:9px;margin-top:18px}.message{display:none;margin-top:14px;padding:13px;border-radius:12px;font-weight:800;line-height:1.5}.message.show{display:block}.message.ok{background:#ddf7e8;color:#17643c}.message.err{background:#ffe4e4;color:#962929}.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.links a{color:#2358a8;font-weight:800;text-decoration:none}.foot{margin-top:18px;color:#718096;font-size:13px;line-height:1.6}@media(max-width:520px){.wrap{padding-top:20px}.card{padding:18px}h1{font-size:23px}}
</style></head><body><main class="wrap"><div class="brand"><div class="logo">RP</div><div><h1>계정·데이터 삭제</h1><div class="sub">앱에 로그인하지 않아도 본인 확인 후 삭제할 수 있습니다.</div></div></div><section class="card"><div class="notice danger-note"><b>주의:</b> 삭제가 완료되면 회원정보, 클라우드 기록, 장바구니, 영수증 결과, 이용권과 베타 테스트 기록을 복구할 수 없습니다. 필요한 자료를 먼저 앱에서 내려받아 주세요.</div><div class="field"><label>이메일 또는 회원번호</label><input id="identifier" autocomplete="username" placeholder="seller@example.com 또는 100001"></div><div class="field"><label>비밀번호</label><input id="password" type="password" autocomplete="current-password" placeholder="현재 비밀번호"></div><div class="field"><label>확인 문구</label><input id="confirmation" autocomplete="off" placeholder="회원탈퇴 입력"></div><div class="actions"><button class="btn primary" id="deleteBtn" onclick="deleteAccount()">계정과 데이터 영구 삭제</button><a class="btn secondary" style="text-align:center;text-decoration:none" href="/">취소하고 앱으로 돌아가기</a></div><div class="message" id="message"></div><div class="links"><a href="/privacy">개인정보처리방침</a><a href="/terms">이용약관</a><a href="https://open.kakao.com/o/gCdVxSFi" target="_blank" rel="noopener noreferrer">고객센터 문의</a></div><div class="foot">관리자 계정은 서비스 운영 보호를 위해 이 페이지에서 삭제할 수 없습니다. 관리자 권한 이전이 필요한 경우 고객센터로 문의해 주세요.</div></section></main><script>function show(text,ok=false){const m=document.getElementById('message');m.textContent=text;m.className='message show '+(ok?'ok':'err')}async function deleteAccount(){const identifier=document.getElementById('identifier').value.trim(),password=document.getElementById('password').value,confirmation=document.getElementById('confirmation').value.trim(),btn=document.getElementById('deleteBtn');if(!identifier||!password){show('이메일 또는 회원번호와 비밀번호를 입력해 주세요.');return}if(confirmation!=='회원탈퇴'){show('확인 문구에 회원탈퇴를 정확히 입력해 주세요.');return}if(!confirm('계정과 모든 연결 데이터를 영구 삭제하시겠습니까?'))return;btn.disabled=true;btn.textContent='삭제 처리 중…';try{const r=await fetch('/api/public/account-delete',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({identifier,password,confirmation})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'삭제 요청을 처리하지 못했습니다.');show(d.message||'계정 삭제가 완료되었습니다.',true);document.getElementById('identifier').value='';document.getElementById('password').value='';document.getElementById('confirmation').value='';btn.style.display='none'}catch(e){show(e.message||'삭제 요청에 실패했습니다.')}finally{btn.disabled=false;btn.textContent='계정과 데이터 영구 삭제'}}</script></body></html>
